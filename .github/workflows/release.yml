name: release

on:
  push:
    tags: ["v*"]

# RubyGems Trusted Publishing (OIDC) — no long-lived API key exists anywhere
# (DESIGN.md §10). Configure the trusted publisher on RubyGems before the first release.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Verify pinned upstream artifacts
        run: bundle exec rake verify:artifacts

      - name: Run the full suite, including release gates
        # KSEF_RELEASE_CHECK enables spec/release_readiness_spec.rb, which fails while the
        # DESIGN.md §12.1 metadata placeholders are unresolved.
        run: bundle exec rspec
        env:
          KSEF_RELEASE_CHECK: "1"

      - run: bundle exec rubocop

      - name: Check the tag matches Ksef::VERSION
        # Requires `ksef/version`, not `ksef_client`. version.rb is standalone, so this
        # needs no gems; requiring the entry point would pull in Zeitwerk, which plain
        # `ruby` cannot see once bundler-cache has installed gems to a bundle path.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(ruby -Ilib -rksef/version -e 'print Ksef::VERSION')"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match Ksef::VERSION $version"
            exit 1
          fi

      # DESIGN.md §10 also requires a green nightly on this commit and a deliberate local
      # full-suite run on Ruby 3.2. Both are human pre-release steps, checked off in
      # CONTRIBUTING.md rather than faked here.
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
