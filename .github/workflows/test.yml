name: test

on:
  push:
    branches: [main]
  pull_request:
  # **A dependency break reaches `main` with no commit here, and only this tier can see it.**
  # `Gemfile.lock` is gitignored (DESIGN.md §4.1) so every leg resolves fresh — which is what
  # makes this suite a drift detector, and what makes it useless when nobody pushes. Twice in
  # one month an upstream release broke `main` on its own: `json` 3.0.0 on 2026-09-07, then
  # faraday 2.14.4 on 2026-09-15. The second sat red for five days because nothing was pushed
  # between 09-16 and 09-20 — under five consecutive *green* nightlies, which could not see it:
  # `nightly.yml` runs only `--tag integration`.
  #
  # 01:30 UTC, an hour before the nightly, deliberately. If the dependencies broke, that mail
  # arrives first and the integration failure an hour later is explained rather than
  # investigated. The nightly keeps 02:30 because its slot has an external constraint (Ministry
  # maintenance) and this one has none: it touches no network and needs no credential.
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

# Explicit and minimal. The Coveralls step only reads the repo and posts outward to
# coveralls.io, so nothing here needs write access.
permissions:
  contents: read

jobs:
  spec:
    name: "spec (ruby ${{ matrix.ruby }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full supported range from DESIGN.md §3, plus `head` as early warning for
        # the next release. 3.2 is the floor and is never dropped without a minor bump.
        ruby: ["3.2", "3.3", "3.4", "4.0", "head"]
        include:
          - ruby: "head"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # Gemfile.lock is gitignored, so every matrix Ruby resolves fresh.
          bundler-cache: true

      - name: Verify pinned upstream artifacts
        run: bundle exec rake verify:artifacts

      - name: Verify codegen is reproducible
        # DESIGN.md §11: `rake fa3:generate` must produce an empty diff. Catches both a
        # non-deterministic generator and a stale committed generated/.
        run: bundle exec rake fa3:verify

      - name: Run specs
        run: bundle exec rspec

      - name: Verify the gem packages
        run: gem build ksef_client.gemspec

      - name: Summarise coverage on the run page
        # All three criteria already reach the artifact, but reading them meant
        # downloading a zip. Coveralls receives line and branch only — LCOV has no
        # function records — so this is the one place all three are visible together.
        if: matrix.ruby == '4.0' && always()
        run: |
          f=coverage/.last_run.json
          [ -f "$f" ] || { echo "no coverage result to summarise"; exit 0; }
          ruby -rjson -e '
            r = JSON.parse(File.read("coverage/.last_run.json"))["result"]
            # Keep in step with the minimum_coverage call in spec/spec_helper.rb,
            # which is the gate that actually fails the build.
            floors = { "line" => 100, "branch" => 98, "method" => 100 }
            rows = r.map do |k, v|
              floor = floors[k]
              mark = floor.nil? ? "" : (v >= floor ? "pass" : "FAIL")
              "| #{k} | #{format("%.2f%%", v)} | #{floor || "-"} | #{mark} |"
            end
            puts "### Coverage", "", "| criterion | value | floor | |", "|---|---|---|---|", *rows
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: matrix.ruby == '4.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Report coverage to Coveralls
        # **Not on a scheduled run.** Coveralls posts its own `coverage/coveralls` commit status
        # whatever triggered the build, and compares against the previous one — so a nightly
        # drift check would re-stat `main`'s tip every day and could turn a green commit red
        # without a change to blame. It counts lines *and* branches together, so even deleting
        # fully covered code reads as a decrease (measured on #47: -0.001%). Coverage reporting
        # belongs to a push or a pull request, where there is a diff it refers to.
        if: matrix.ruby == '4.0' && github.event_name != 'schedule'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/lcov.info
          # github-token defaults to ${{ github.token }}, so there is no secret to
          # create or rotate.
          #
          # **Enforcement, not reporting** (decided 2026-08-26). This said the opposite,
          # on the reasoning that spec_helper.rb's SimpleCov gate already fails the build
          # and a third-party outage should not redden the leg. The reasoning was sound
          # and the flag did not implement it: `fail-on-error` covers only the *action*
          # erroring, while the `coverage/coveralls` commit status Coveralls posts on its
          # own gates the PR regardless — so the leg stayed green while the PR went
          # UNSTABLE, and the workflow claimed a policy it was not applying. Given the
          # status blocks either way, the honest setting is the one that reports the
          # failure where it happens.
          fail-on-error: true

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          # Lint on the development Ruby; the cop config targets 3.2 regardless.
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop --format github
