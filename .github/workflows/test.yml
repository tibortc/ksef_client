name: test

on:
  push:
    branches: [main]
  pull_request:

# Explicit and minimal. The Coveralls step only reads the repo and posts outward to
# coveralls.io, so nothing here needs write access.
permissions:
  contents: read

jobs:
  spec:
    name: "spec (ruby ${{ matrix.ruby }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full supported range from DESIGN.md §3, plus `head` as early warning for
        # the next release. 3.2 is the floor and is never dropped without a minor bump.
        ruby: ["3.2", "3.3", "3.4", "4.0", "head"]
        include:
          - ruby: "head"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # Gemfile.lock is gitignored, so every matrix Ruby resolves fresh.
          bundler-cache: true

      - name: Verify pinned upstream artifacts
        run: bundle exec rake verify:artifacts

      - name: Verify codegen is reproducible
        # DESIGN.md §11: `rake fa3:generate` must produce an empty diff. Catches both a
        # non-deterministic generator and a stale committed generated/.
        run: bundle exec rake fa3:verify

      - name: Run specs
        run: bundle exec rspec

      - name: Verify the gem packages
        run: gem build ksef_client.gemspec

      - name: Upload coverage artifact
        if: matrix.ruby == '4.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Report coverage to Coveralls
        if: matrix.ruby == '4.0'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/lcov.info
          # github-token defaults to ${{ github.token }}, so there is no secret to
          # create or rotate.
          #
          # Coveralls is reporting, not enforcement: the 90% SimpleCov gate in
          # spec_helper.rb already fails the build in-repo. A third-party outage should
          # not turn this matrix leg red.
          fail-on-error: false

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # Lint on the development Ruby; the cop config targets 3.2 regardless.
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop --format github
