name: nightly

# Live integration against the KSeF TEST environment. Never runs per-PR (DESIGN.md §9):
# it consumes shared TEST-environment state and is subject to the API's rate limits.
on:
  # Enabled 2026-08-23, once `rake auth:bootstrap` had provisioned KSEF_TEST_NIP and
  # KSEF_TEST_TOKEN in the `ksef-test` environment (DESIGN.md §12.4, resolved).
  #
  # 02:30 UTC is deliberately outside 16:00-18:00 local, when the Ministry runs scheduled
  # maintenance on the test environments (docs/REFERENCE.md §11.3).
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: ksef-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Refuse to run against production
        # Belt and braces alongside the in-suite guard (DESIGN.md §4.5).
        run: |
          if [ "${KSEF_ENV}" = "prod" ]; then
            echo "::error::Nightly integration must never target production."
            exit 1
          fi
        env:
          KSEF_ENV: test

      - name: Check the pinned spec still matches the live TEST contract
        # An upstream contract change should surface here, not in a user's pipeline.
        run: bundle exec rake verify:artifacts

      - name: Run live integration specs
        # KSEF_INTEGRATION lifts the exclusion filter; --tag then selects only these specs.
        # Both are needed: RSpec ANDs exclusion filters with CLI inclusions.
        run: bundle exec rspec --tag integration
        env:
          KSEF_ENV: test
          KSEF_INTEGRATION: "1"
          KSEF_TEST_NIP: ${{ secrets.KSEF_TEST_NIP }}
          KSEF_TEST_TOKEN: ${{ secrets.KSEF_TEST_TOKEN }}
