name: record-cassettes

# Records the VCR cassettes for the recorded test tier (DESIGN.md §9.1).
#
# **Manual only, and it runs here rather than on a developer machine for one reason: this is
# where the credentials are.** `KSEF_TEST_NIP` and `KSEF_TEST_TOKEN` are environment secrets on
# `ksef-test`, scoped so that only a job declaring that environment can read them — which is
# also why nobody should mint a second credential locally just to record.
#
# It creates a **permanent TEST invoice** and consumes rate-limited quota (docs/REFERENCE.md
# §6), so it is `workflow_dispatch` and nothing else. No schedule.
#
# The cassettes are uploaded as an artifact rather than committed. A cassette is the one
# artifact in this repository that could carry a live credential, and the scrub happens on
# write — so a human reviews it before it enters git history, which `git` would then remember
# whatever the fix. The hygiene spec runs here first, but "the scanner passed" is not the same
# as "someone looked".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "record" to confirm this will create a permanent TEST invoice'
        required: true
        default: ""
      target:
        # `record: :all` re-records every cassette it runs, and each example of
        # session_flow_spec.rb submits an invoice that cannot be withdrawn. Narrowing to the
        # one flow that changed is therefore the difference between one authentication and
        # two permanent TEST invoices.
        #
        # `spec/recorded/auth_refresh_spec.rb` is the cheapest real recording — an
        # authentication and no invoice — which makes it the right first target after any
        # change to this workflow.
        description: "Which recorded specs to run (default: all of spec/recorded)"
        required: false
        default: "spec/recorded"
      dry_run:
        # **Everything except the irreversible step.**
        #
        # This workflow had never succeeded — four dispatches, four failures — and the only
        # step that has still never executed is the artifact upload, because it used to be
        # skipped whenever the replay failed. Proving it used to cost a permanent TEST invoice,
        # which is a poor price for testing a `if:` condition.
        #
        # With this set, `Record` is skipped and every other step runs against the cassettes
        # already committed: the confirmation guard, the TEST guard, the hygiene scan **with
        # the real token in the environment** (the one check that cannot run anywhere else),
        # the full-tier replay, and the upload. Zero invoices, and the plumbing is proven.
        #
        # The confirmation is still required. A dry run that could be started with less
        # ceremony is a dry run that a mistyped flag turns into a real one.
        description: "Skip the recording step and exercise the rest against the committed cassettes"
        required: false
        type: boolean
        default: false

# Least privilege: this job reads the repo and uploads an artifact. It needs nothing else, and
# it is the one workflow in this repository holding a live KSeF credential — so an injected
# command should not also inherit a writable GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    environment: ksef-test

    # **One place decides the environment**, and the guard below reads *that* rather than a
    # literal it set itself. It used to set `KSEF_ENV: test` in the guard step's own `env:` and
    # then ask whether it equalled `prod` — comparing a literal against a different literal, so
    # the check could not fail. Hoisted here, every step inherits it and the guard validates the
    # single setting they all share.
    env:
      KSEF_ENV: test

    steps:
      # **Never interpolate `${{ }}` into a `run:` script.** GitHub substitutes it textually
      # before the shell parses, so a dispatch input can close the quote and append commands —
      # and this job exports KSEF_TEST_TOKEN, which log masking does not protect from a network
      # exfiltration. Passing through `env:` puts the value in the process environment, where
      # the shell only ever sees it as data.
      #
      # This guard runs before checkout, so an injection here could also write $GITHUB_ENV and
      # defeat the confirmation it exists to enforce.
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "record" ]; then
            echo "::error::Confirmation not given. This job creates a permanent TEST invoice."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Refuse to run against anything but TEST
        # An allow-list, matching `rake vcr:record`'s own guard: `prod` is the one that must
        # never happen, but `demo` would be just as wrong here and a typo wronger still.
        run: |
          if [ "$KSEF_ENV" != "test" ]; then
            echo "::error::Recording is TEST-only, got KSEF_ENV=$KSEF_ENV."
            exit 1
          fi

      - name: Record
        # **The one step a dry run skips**, because it is the only one that cannot be undone.
        # `spec/workflows_spec.rb` asserts it is the only step mentioning `dry_run`, so the
        # flag cannot quietly grow to skip the hygiene scan as well.
        if: ${{ !inputs.dry_run }}
        # `TARGET` through the environment, for the reason above — this step is where the
        # credential actually lives.
        run: bundle exec rake "vcr:record[$TARGET]"
        env:
          TARGET: ${{ inputs.target }}
          KSEF_TEST_NIP: ${{ secrets.KSEF_TEST_NIP }}
          KSEF_TEST_TOKEN: ${{ secrets.KSEF_TEST_TOKEN }}

      - name: Scan the recordings for credentials
        id: hygiene
        # The scrub happens on write; this proves it worked, with the real token in the
        # environment so the scan compares against the value that was actually used.
        #
        # The NIP is deliberately absent: it is not scrubbed and not scanned for. A tax
        # identifier is printed on every invoice and is embedded in the KSeF number, so
        # redacting it corrupts the documents the cassette exists to hold (DESIGN.md §9.1).
        run: bundle exec rspec spec/cassette_hygiene_spec.rb
        env:
          KSEF_TEST_TOKEN: ${{ secrets.KSEF_TEST_TOKEN }}

      - name: Replay them with no credentials at all
        # The point of the tier. If this fails, the cassettes depend on something the replay
        # cannot supply — a live token, a fresh timestamp — and are not yet usable.
        #
        # **Always the whole tier, never `inputs.target`.** A recording that only replays what
        # it just wrote cannot see that it broke a cassette it did not touch. And this step is
        # the one that would have caught the fifteen-minute credential expiry, had it run more
        # than a few minutes after the recording (DESIGN.md §9.1).
        run: bundle exec rspec spec/recorded

      # **Upload whenever the cassettes have passed the credential scan, even if the replay
      # then failed.** This step carried no `if:` at all until 2026-09-07, which means an
      # implicit `success()` — so a failure in the replay above skipped it and discarded the
      # recording. That happened twice (runs 32951640218 and 32955762854): both recorded real
      # cassettes, both passed the scan, both failed the replay on an unrelated spec bug, and
      # both threw away a permanent, unwithdrawable TEST invoice. Every cassette in this
      # repository was recorded locally as a result, against this section's own decision that
      # recording belongs in CI.
      #
      # **Not `if: always()`**, which is the obvious repair and the wrong one: it would upload
      # when the *scan* failed too — exactly when a cassette may hold a live credential — and on
      # a public repository anyone with the run id can fetch the artifact. Gating on the scan's
      # own outcome uploads a verified-clean recording whatever the replay did, and uploads
      # nothing when the scan failed or never ran. Losing a cassette that failed the scan is
      # correct: it is a leak, not an artifact.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.hygiene.outcome == 'success'
        with:
          name: cassettes
          path: spec/cassettes/
          if-no-files-found: error
          # This artifact is by definition the copy nobody has reviewed yet — the one most
          # likely to hold whatever the scrubber missed. On a public repository anyone with the
          # run id can fetch it, so it should not sit around for the default 90 days.
          retention-days: 1
