name: nightly

# Live integration against the KSeF TEST environment. Never runs per-PR (DESIGN.md §9):
# it consumes shared TEST-environment state and is subject to the API's rate limits.
on:
  # Enabled 2026-08-23. `rake auth:bootstrap` minted the credential (DESIGN.md §12.4,
  # resolved); KSEF_TEST_NIP and KSEF_TEST_TOKEN are then stored as **environment** secrets
  # on `ksef-test`, not repository secrets. That scoping is the point: a repository secret
  # is readable by every workflow in the repo, so `release.yml` — or anything added later —
  # could read a live KSeF credential. Only a job declaring this environment can.
  #
  # The environment is further restricted to the `main` branch. Without that, any
  # pushed branch could carry a workflow declaring `environment: ksef-test` and read the
  # token. Both triggers below run on `main`, so the restriction costs nothing.
  #
  # 02:30 UTC is deliberately outside 16:00-18:00 local, when the Ministry runs scheduled
  # maintenance on the test environments (docs/REFERENCE.md §11.3).
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

# Least privilege, matching `test.yml` and `release.yml`. This job holds a live KSeF credential
# and needs only to read the repository.
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: ksef-test

    # **One place decides the environment**, and the guard below reads *that* rather than a
    # literal it set itself. It used to set `KSEF_ENV: test` in the guard step's own `env:` and
    # then ask whether it equalled `prod`, which compares a literal against a different literal
    # — a check that could not fail, in the step whose whole job is to be able to.
    env:
      KSEF_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Refuse to run against anything but TEST
        # Belt and braces alongside the in-suite guard (DESIGN.md §4.5), which reads the same
        # variable at `before(:suite)`. An allow-list rather than a `prod` denylist: this tier
        # is TEST-only, so `demo` would be wrong here too and a typo wronger still.
        run: |
          if [ "$KSEF_ENV" != "test" ]; then
            echo "::error::Nightly integration is TEST-only, got KSEF_ENV=$KSEF_ENV."
            exit 1
          fi

      - name: Check the pinned spec still matches the live TEST contract
        # An upstream contract change should surface here, not in a user's pipeline.
        run: bundle exec rake verify:artifacts

      - name: Run live integration specs
        # KSEF_INTEGRATION lifts the exclusion filter; --tag then selects only these specs.
        # Both are needed: RSpec ANDs exclusion filters with CLI inclusions.
        #
        # The JSON formatter is what the next step reads. `progress` is kept alongside it so the
        # log still reads the way it always has.
        run: bundle exec rspec --tag integration --format progress --format json --out "$RSPEC_JSON"
        env:
          KSEF_INTEGRATION: "1"
          RSPEC_JSON: rspec-integration.json
          KSEF_TEST_NIP: ${{ secrets.KSEF_TEST_NIP }}
          KSEF_TEST_TOKEN: ${{ secrets.KSEF_TEST_TOKEN }}

      - name: Refuse a vacuously green run
        # **A failed nightly notifies the maintainer; a nightly that passes without running
        # anything notifies nobody**, because it is a success. That is this project's documented
        # failure mode — "a green run of *zero* examples" — and the reason the example count has
        # been read by hand after every run.
        #
        # Two paths produce one, and neither is hypothetical:
        #
        #   * `KSEF_INTEGRATION` unset or misspelled. `spec_helper.rb`'s
        #     `filter_run_excluding(:integration)` then matches nothing and RSpec exits 0 on
        #     zero examples.
        #   * The TEST credentials missing, rotated, or unreadable because the environment
        #     protection changed. `session_flow_spec.rb` and `crypto_spec.rb` each `skip` in
        #     their entirety — 20 of the 27 examples — and RSpec exits 0 on an all-pending file.
        #     This is the likelier one: a credential lapsing is a matter of time, and it fails
        #     green.
        #
        # The numbers are measured, not assumed: 27 examples (7 auth, 9 crypto, 11 session), of
        # which exactly **one** may legitimately skip — the collective UPO page at
        # `session_flow_spec.rb:169`, which KSeF generates asynchronously and may not have ready.
        # So the invariant is "at most that one", which survives integration specs being added
        # and goes red the moment a file opts out silently. A raw count floor would not.
        env:
          RSPEC_JSON: rspec-integration.json
          MAX_PENDING: "1"
        run: |
          ruby -rjson -e '
            summary = JSON.parse(File.read(ENV.fetch("RSPEC_JSON"))).fetch("summary")
            total   = summary.fetch("example_count")
            pending = summary.fetch("pending_count")
            allowed = Integer(ENV.fetch("MAX_PENDING"))
            puts "#{total} examples, #{pending} pending, #{total - pending} executed"

            if total.zero?
              warn "::error::The nightly passed without running a single example, so it " \
                   "verified nothing. The integration tier was filtered out entirely — " \
                   "check that KSEF_INTEGRATION is still set on the step above."
              exit 1
            end

            if pending > allowed
              warn "::error::#{pending} of #{total} examples skipped; at most #{allowed} is " \
                   "expected. The TEST credentials have most likely lapsed — session_flow " \
                   "and crypto skip wholesale when KSEF_TEST_NIP/KSEF_TEST_TOKEN cannot be " \
                   "read, and that failure is otherwise green."
              exit 1
            end
          '
